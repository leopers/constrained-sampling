[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constrained-sampling"
version = "0.1.0"
description = "PyTorch experiments with primal-dual Langevin Monte Carlo"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]